<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 344" width="880" height="344" role="img" aria-label="sdd idle check: a task dispatched with no completion holds the stop">
  <rect width="880" height="344" rx="14" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="879" height="343" rx="14" fill="none" stroke="#30363d"/>

  <text x="40" y="56" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="26" font-weight="600" fill="#e6edf3">sdd idle check</text>
  <text x="40" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#8b949e">a dispatch line with no complete line does not end the turn</text>

  <text x="170" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#484f58">dispatched</text>
  <text x="310" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#484f58">complete</text>
  <text x="64" y="159" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8b949e">Task 1</text>
  <rect x="170" y="150" width="110" height="8" rx="4" fill="#6e7681" opacity="0.6"/>
  <line x1="286" y1="154" x2="304" y2="154" stroke="#30363d" stroke-width="1"/>
  <rect x="310" y="150" width="110" height="8" rx="4" fill="#3fb950" opacity="0.9"/>
  <text x="64" y="191" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8b949e">Task 2</text>
  <rect x="170" y="182" width="110" height="8" rx="4" fill="#6e7681" opacity="0.6"/>
  <line x1="286" y1="186" x2="304" y2="186" stroke="#30363d" stroke-width="1"/>
  <rect x="310" y="182" width="110" height="8" rx="4" fill="#3fb950" opacity="0.9"/>
  <text x="64" y="223" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8b949e">Task 3</text>
  <rect x="170" y="214" width="110" height="8" rx="4" fill="#6e7681" opacity="0.6"/>
  <line x1="286" y1="218" x2="304" y2="218" stroke="#30363d" stroke-width="1"/>
  <rect x="310" y="214" width="110" height="8" rx="4" fill="#3fb950" opacity="0.9"/>
  <text x="64" y="255" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8b949e">Task 4</text>
  <rect x="170" y="246" width="110" height="8" rx="4" fill="#6e7681" opacity="0.6"/>
  <line x1="286" y1="250" x2="304" y2="250" stroke="#30363d" stroke-width="1"/>
  <rect x="310.5" y="242.5" width="109" height="15" rx="7" fill="none" stroke="#f85149" stroke-width="1" stroke-dasharray="4 3" opacity="0.85"/>
  <text x="310" y="282" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#f85149" opacity="0.9">no complete line</text>

  <path d="M462 200 h58" stroke="#484f58" stroke-width="2" fill="none"/>
  <path d="M514 194 l8 6 -8 6" stroke="#484f58" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="568" y="168" width="176" height="64" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="656" y="206" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#c9d1d9" text-anchor="middle">Stop</text>
  <rect x="552" y="198" width="208" height="4" rx="2" fill="#f85149" opacity="0.95"/>

  <text x="40" y="322" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#484f58">every message looks productive &#183; the slot is empty</text>
</svg>
